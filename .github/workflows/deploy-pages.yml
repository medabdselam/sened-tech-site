name: Deploy public files to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # الإجراءات مثبَّتة ببصمة الكوميت لا بالوسم: الوسم v4 مؤشّر قابل لإعادة
      # التوجيه، وهذه المهمة تملك pages: write أي صلاحية النشر على النطاق.
      # يحدّثها Dependabot شهريًا (.github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage only approved public files
        run: python3 tools/stage_site.py
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # ‏.nojekyll و.well-known/ ملفات مخفيَّة، وupload-artifact يستثنيها
          # افتراضيًّا. بدونها يعود Jekyll فيحجب .well-known ويختفي security.txt.
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
